syntax = "proto3";

package objdiff.report;

// Project progress report
message Report {
  // Overall progress info
  Measures measures = 1;
  // Units within this report
  repeated ReportUnit units = 2;
  // Report version
  uint32 version = 3;
  // Progress categories
  repeated ReportCategory categories = 4;
  // Which RULER produced these numbers. Optional and purely descriptive: it
  // changes no measure. Absent on every report generated before 2026-08-12 and
  // on reports produced by anything other than `objdiff-cli report generate`.
  // See ReportProvenance.
  optional ReportProvenance provenance = 5;
}

// The identity of the measuring instrument that produced a report.
//
// A progress report is a MEASUREMENT, and until this message existed it did not
// say what took it. Two failures on 2026-08-12 came from exactly that gap: an
// A/B of two objdiff builds that returned identical numbers in all six
// project x ruler cells (the two arms shared one report cache, and the binary
// is not part of the cache key -- the real delta was +71 complete functions),
// and a run that changed only the alias map and measured +0 against a map
// carrying 340 more names (+143 functions). Neither report could be told apart
// from a correct one after the fact, because neither carried the identity of
// the ruler that produced it. This message makes every report self-describing:
// two reports that disagree can be checked for whether they were even measured
// with the same instrument.
//
// Deliberately contains NO timestamp and no hostname. Report bytes are compared
// for equality by several tools here; a clock in the report would make every
// report differ from every other and destroy that. Everything in here changes
// only when something that can change a NUMBER changes.
message ReportProvenance {
  // objdiff's own crate version, e.g. "4.2.3". Coarse: many semantically
  // different builds share it.
  string tool_version = 1;
  // xxHash3-64 (hex) of the objdiff-cli executable that produced the report.
  // This is the AUTHORITATIVE identity -- it distinguishes builds that
  // `tool_version` and even `tool_commit` cannot (a dirty tree, a different
  // feature set, a different compiler). Empty if the executable could not be
  // read, in which case the report cache was disabled for that run.
  string tool_binary_hash = 2;
  // Git commit the source tree was on when objdiff-cli's build script last ran,
  // with a "-dirty" suffix if the tree had uncommitted tracked changes then.
  // ADVISORY ONLY: cargo may not re-run the build script for every source edit,
  // so this can lag the binary. `tool_binary_hash` cannot. Empty if the build
  // happened outside a git checkout.
  string tool_commit = 3;
  // The project-level EFFECTIVE diff config, one "key=value" per property, in
  // objdiff's canonical property order: the report's base config with the
  // project's `options` block and then `-c key=value` applied. This is the
  // ruler. Note a unit's own `options` block can still override it per unit;
  // `units_with_option_overrides` says whether any did.
  repeated string diff_config = 4;
  // The `-c key=value` arguments as passed on the command line, verbatim.
  repeated string config_args = 5;
  // Number of units carrying their own `options` block, i.e. units whose
  // effective config may differ from `diff_config`. 0 for every project here.
  uint32 units_with_option_overrides = 6;
  // The project's `map_file` as spelled in objdiff.json, or empty if none.
  string map_file = 7;
  // xxHash3-64 (hex) of the map file's bytes. The map supplies ICF symbol
  // equivalences, so it moves scores; a report that does not name it cannot be
  // told apart from one measured against a different map.
  string map_file_hash = 8;
  // Number of symbol-equivalence entries parsed out of the map file.
  uint32 map_file_entries = 9;
  // Report-cache accounting for this run: units served from the `<output>.cache`
  // sidecar, and units diffed fresh. hits+misses is the unit count.
  // `cache_misses == 0 && cache_hits > 0` means NOTHING in this report was
  // recomputed. That is sound as long as the cache key covers every input --
  // which is what `tool_binary_hash` and `map_file_hash` are doing in the key --
  // but a consumer that wants to grade a run on freshly computed numbers can
  // check it here instead of scraping stderr.
  // (proto3 JSON omits zero-valued scalars, so a fully-cached run writes
  // `cache_hits` and no `cache_misses`, and a fully-fresh run the reverse.
  // Read a missing counter as 0, not as "unknown".)
  uint32 cache_hits = 10;
  uint32 cache_misses = 11;
}

// Progress info for a report or unit
message Measures {
  // Overall match percent, including partially matched functions and data
  float fuzzy_match_percent = 1;
  // Total size of code in bytes
  uint64 total_code = 2;
  // Fully matched code size in bytes
  uint64 matched_code = 3;
  // Fully matched code percent
  float matched_code_percent = 4;
  // Total size of data in bytes
  uint64 total_data = 5;
  // Fully matched data size in bytes
  uint64 matched_data = 6;
  // Fully matched data percent
  float matched_data_percent = 7;
  // Total number of functions
  uint32 total_functions = 8;
  // Fully matched functions
  uint32 matched_functions = 9;
  // Fully matched functions percent
  float matched_functions_percent = 10;
  // Completed (or "linked") code size in bytes
  uint64 complete_code = 11;
  // Completed (or "linked") code percent
  float complete_code_percent = 12;
  // Completed (or "linked") data size in bytes
  uint64 complete_data = 13;
  // Completed (or "linked") data percent
  float complete_data_percent = 14;
  // Total number of units
  uint32 total_units = 15;
  // Completed (or "linked") units
  uint32 complete_units = 16;
  // Number of functions counted as matched (100%) whose 100% rests on a
  // SYMBOL-LEVEL NORMALIZATION rather than on a name-identified pairing — i.e.
  // the part of `matched_functions` whose per-row attribution is not verified.
  // Three sources feed it:
  //
  //  0. Funclet BYTE-SIGNATURE PAIRING (`pair_funclets_by_bytes`, ALL passes,
  //     always on). An anonymous target funclet (`fn_<addr>`, `__unwind$N`,
  //     `__catch$N`, `??__E*`, `??__F*`) has no name to pair on, so it is paired
  //     against a base funclet by comparing MASKED bodies — relocation targets
  //     are blanked in the signature. The pairing therefore establishes "same
  //     body shape", not "same function". Such credit IS supply-backed (our
  //     compiler emitted a body of that shape) but the per-row attribution is
  //     ARBITRARY within a byte-signature group, and the reloc targets that
  //     would break the tie are masked in the signature and, under the default
  //     `functionRelocDiffs=none` ruler, in the score as well. Flagged via
  //     `SymbolDiff::masked_equal_symbol`.
  //     ⚠ This source DOMINATES: on rb3-xenon it is ~19x larger than source 1,
  //     which was the only source disclosed before 2026-08-02. Consumers that
  //     compared `matched - masked_equal` across that change will see a large
  //     one-time drop that is a DISCLOSURE change, not a regression: no score
  //     moved.
  //
  //  1. Funclet OVER-SUBSCRIPTION (`pair_funclets_by_bytes` pass 2b, always on)
  //     — a strict SUBSET of source 0, retained separately because it is the one
  //     case where the surplus member of a group can be named:
  //     N byte-identical anonymous target funclets (`fn_<addr>`, `__unwind$N`,
  //     `__catch$N`, `??__E*`, `??__F*`) paired many-to-one onto M < N base
  //     funclets. The N-M overflow is credited 100% against a base symbol some
  //     other target symbol already owns, so it is machine code we never
  //     generated. Detected here as two or more target symbols sharing one base
  //     partner index (every non-funclet pairing consumes its base partner, so a
  //     duplicated partner is exactly a pass-2b pairing).
  //  2. The opt-in case-B global byte-equality second pass, which promotes an
  //     unmatched named method whose retail body was byte-identical to a body
  //     carved into a foreign unit's target span (0 unless
  //     `report generate --global-byte-eq` was used).
  //
  // Disclosure only — this is a SUBSET of `matched_functions`, never an
  // addition, and populating it changes no other measure. `matched_functions`,
  // `matched_code`, `total_*` and `fuzzy_match_percent` are computed
  // independently of this bit; if any of them moves when this field's definition
  // changes, that is a BUG. See the per-item `ReportItem.masked_equal` bit and
  // docs/decomp/identity-transfer.md.
  //
  //     matched_functions - masked_equal_functions  =  a CONSERVATIVE FLOOR
  //
  // Read it as a floor and nothing more. It is NOT "the number of real matches":
  // source 0 subtracts credit that our compiler genuinely supplied, so the true
  // honest count sits strictly BETWEEN the floor and `matched_functions`. Do not
  // quote the floor as if it were an estimate of the truth, and do not quote
  // `matched_functions` as if the attribution were verified. Two different
  // questions:
  //     "did we emit this many matching bodies?"      -> matched_functions
  //     "how many are name-verified, row by row?"     -> >= the floor
  //
  // There is deliberately no byte-side counterpart field: the byte figure is
  // derivable from the report itself as the sum of `size` over `functions` items
  // with `masked_equal == true` (and `fuzzy_match_percent == 100`), so adding a
  // measure would duplicate state that can go stale.
  //
  // Sizing evidence for source 1 (kept for the record): compiling pass 2b out
  // entirely on rb3-xenon @ ca711730 moved `matched_functions` 39,743 -> 38,210,
  // a real inflation of 1,533, while this field then reported 1,582. The 49
  // extra were re-paired by funclet pass 3 onto genuinely UNUSED base funclets
  // and still scored 100%, so that credit was mis-attributed rather than
  // unsupported. Fixing that in-report would require changing which symbols pair
  // with which (e.g. running pass 2b after pass 3), which WOULD move existing
  // measures; this field deliberately does not.
  uint32 masked_equal_functions = 17;
}

message ReportCategory {
  // The ID of the category
  string id = 1;
  // The name of the category
  string name = 2;
  // Progress info for this category
  Measures measures = 3;
}

// A unit of the report (usually a translation unit)
message ReportUnit {
  // The name of the unit
  string name = 1;
  // Progress info for this unit
  Measures measures = 2;
  // Sections within this unit
  repeated ReportItem sections = 3;
  // Functions within this unit
  repeated ReportItem functions = 4;
  // Extra metadata for this unit
  optional ReportUnitMetadata metadata = 5;
}

// Extra metadata for a unit
message ReportUnitMetadata {
  // Whether this unit is marked as complete (or "linked")
  optional bool complete = 1;
  // The name of the module this unit belongs to
  optional string module_name = 2;
  // The ID of the module this unit belongs to
  optional uint32 module_id = 3;
  // The path to the source file of this unit
  optional string source_path = 4;
  // Progress categories for this unit
  repeated string progress_categories = 5;
  // Whether this unit is automatically generated (not user-provided)
  optional bool auto_generated = 6;
}

// A section or function within a unit
message ReportItem {
  // The name of the item
  string name = 1;
  // The size of the item in bytes
  uint64 size = 2;
  // The overall match percent for this item
  float fuzzy_match_percent = 3;
  // Extra metadata for this item
  optional ReportItemMetadata metadata = 4;
  // Address of the item (section-relative offset)
  optional uint64 address = 5;
  // Match percent excluding arg-only differences (register/offset swaps)
  optional float match_percent_normalized = 6;
  // Disclosure: this item's 100% rests on a SYMBOL-LEVEL NORMALIZATION rather
  // than on a name-identified pairing. Any of:
  //   (a) the pair was formed by funclet BYTE-SIGNATURE matching
  //       (`pair_funclets_by_bytes`, any pass) — the bodies were compared with
  //       relocation targets masked, so the pairing means "same body shape", and
  //       which target funclet this base funclet is credited against is arbitrary
  //       within the signature group;
  //   (b) it is funclet OVER-SUBSCRIPTION surplus — a pass-2b many-to-one pairing
  //       onto a base funclet another target symbol already owns (a subset of (a)
  //       in which the surplus member can be named);
  //   (c) it was promoted to 100% by the opt-in case-B global byte-equality
  //       second pass (`reconcile_global_byte_matches`).
  // Absent/false for a normally-diffed item. NEVER changes the score. Items
  // flagged this way are summed into `Measures.masked_equal_functions`; summing
  // their `size` gives the byte-side figure.
  //
  // (a) does NOT mean the bytes are fabricated — our compiler really emitted a
  // body of that shape. It means the ROW ATTRIBUTION is unverified. For (b),
  // byte-identical funclets are interchangeable, so WHICH member of an
  // over-subscribed group carries the surplus is arbitrary (the non-funclet-paired
  // member, else the lowest symbol index, is treated as the legitimate owner); the
  // per-group COUNT is exact.
  optional bool masked_equal = 7;
}

// Extra metadata for an item
message ReportItemMetadata {
  // The demangled name of the function
  optional string demangled_name = 1;
  // The virtual address of the function or section
  optional uint64 virtual_address = 2;
}
